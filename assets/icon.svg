<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Halo Clipper app icon.
       Family DNA from the HaloOS logo (Catppuccin Mocha, tilted halo ring,
       rosewater→mauve→blue gradient) fused with editor language: a play mark
       wearing the halo, above a timeline with a cut and the playhead parked
       exactly on the cut point. -->
  <defs>
    <!-- Background: near-flat vertical fade for depth without noise -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#242438"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <!-- The HaloOS ring gradient (same stops as the OS logo) -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f5e0dc"/>
      <stop offset="50%"  stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <!-- Accent used for the "active clip" on the timeline -->
    <linearGradient id="clip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <!-- Soft glow behind the ring -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="55%"  stop-color="#cba6f7" stop-opacity="0"/>
      <stop offset="80%"  stop-color="#cba6f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded-square plate -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Glow + tilted halo ring, behind the play mark -->
  <circle cx="256" cy="196" r="170" fill="url(#glow)"/>
  <ellipse cx="256" cy="186" rx="146" ry="54" fill="none"
           stroke="url(#ring)" stroke-width="16" stroke-linecap="round"
           transform="rotate(-12 256 186)"/>

  <!-- Play mark (rounded corners via stroke) -->
  <path d="M 212 122 L 212 278 L 348 200 Z"
        fill="#e8ecf8" stroke="#e8ecf8" stroke-width="26"
        stroke-linejoin="round"/>

  <!-- Timeline: active clip · cut · rest of the take -->
  <rect x="88"  y="374" width="200" height="40" rx="13" fill="url(#clip)"/>
  <rect x="316" y="374" width="108" height="40" rx="13" fill="#45475a"/>

  <!-- Playhead parked on the cut -->
  <path d="M 288 340 L 316 340 L 302 362 Z" fill="#f5e0dc"/>
  <rect x="299" y="352" width="6" height="76" rx="3" fill="#f5e0dc"/>
</svg>
