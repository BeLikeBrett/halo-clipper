[package]
name = "halo_clipper"
version = "0.10.9"
edition = "2021"
description = "Halo Clipper — fast, native Windows and Linux video editor"
license = "MIT"

[[bin]]
name = "halo-clipper"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }
egui_glow = "0.29"
glow = "0.14"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
env_logger = "0.11"
libmpv2 = {version="6",default-features=false}
libmpv2-sys = "4.0.1"
libloading = "0.8"

reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
semver = "1"
ab_glyph = "0.2"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }

raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# Pointer position during X11 file drags (winit reports none).
x11-dl = "2.21"
# File drops on native Wayland (winit only reports them on X11).
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
libc = "0.2"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
